version: "2"
sql:
  - engine: sqlite
    queries: internal/database/queries
    schema: internal/database/migrations
    gen:
      go:
        package: db
        out: internal/database/db
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        rename:
          user_safe: "UserSave"
          discover_crawl_safe: "DiscoverCrawlSave"
