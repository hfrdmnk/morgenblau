name: Sync Tangled

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-tangled
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror branches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Tangled SSH
        env:
          TANGLED_SSH_KEY: ${{ secrets.TANGLED_SSH_KEY }}
        run: |
          test -n "$TANGLED_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$TANGLED_SSH_KEY" > "$HOME/.ssh/tangled"
          chmod 0600 "$HOME/.ssh/tangled"
          ssh-keyscan -t ed25519 tangled.org > "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}' | grep -Fxq 'SHA256:fLyp6ivr5HqmGI8yJiPYstTiJa2AXF/RAa9kF/ur1xo'

      # A namespace of its own keeps origin/HEAD out of the mirror; push ignores negative refspecs.
      - name: Fetch every GitHub branch
        run: git fetch --prune origin '+refs/heads/*:refs/mirror/*'

      - name: Mirror branches to Tangled
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/tangled -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        # The knot rate-limits per source IP, and hosted runners share IPs with other jobs.
        run: |
          for delay in 15 30 45 0; do
            git push --force --prune git@tangled.org:dominikhofer.me/morgenblau 'refs/mirror/*:refs/heads/*' && exit 0
            [ "$delay" -gt 0 ] || exit 1
            sleep "$delay"
          done
