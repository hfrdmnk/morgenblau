name: Refresh site

# The landing page's hero shows Dominik's digest for the current day in Zurich, fetched when the site builds, so the site rebuilds every hour.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same group as the site deploy in ci.yml, so an hourly refresh and a push never deploy at once.
    concurrency:
      group: fly-deploy-site
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_SITE }}
        run: flyctl deploy --local-only
