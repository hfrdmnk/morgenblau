name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# PR pushes supersede each other; every commit on main gets its own run so none skips CI or its deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # renovate: datasource=github-releases depName=sqlc-dev/sqlc extractVersion=^v(?<version>.*)$
      SQLC_VERSION: 1.31.1
      # renovate: datasource=go depName=github.com/pressly/goose/v3
      GOOSE_VERSION: v3.30.0
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check lexicon compatibility freeze
        env:
          LEXICON_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-lexicons.sh "$LEXICON_BASE"

      - name: Check existing migrations are unchanged
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-migrations.sh "$MIGRATION_BASE"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache: false

      # setup-go saves once per go.sum and Go trims entries unused for 5 days, so roll the cache on every main push.
      - name: Restore Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-
            go-${{ runner.os }}-

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}

      # internal/database/db embeds the SQL that runs; a stale copy runs queries nobody reviewed.
      - name: Check sqlc output is current
        run: sqlc diff

      - name: Install Goose for migration tests
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@"$GOOSE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check Bun is the only package manager
        run: |
          stray="$(git ls-files ':(top)*package-lock.json' ':(top)*pnpm-lock.yaml' ':(top)*yarn.lock')"
          test -z "$stray" || { echo "Remove $stray: Bun owns every install (bun.lock), so installs stay reproducible."; exit 1; }

      - name: Check generated component paths
        run: |
          generated="$(git ls-files -- ':(glob)frontend/@/**')"
          test -z "$generated" || { echo "Move $generated into frontend/src/components/ui: @ is an import alias, not a source directory."; exit 1; }

      - name: Install frontend dependencies
        run: bun install --cwd ./frontend --frozen-lockfile

      - name: Check verification harness
        run: |
          for script in ../.agents/setup ../.agents/resume ../.agents/skills/verify-morgenblau/bin/verify ../.agents/skills/verify-morgenblau/tools/test-harness.sh; do
            bash -n "$script"
          done
          bash ../.agents/skills/verify-morgenblau/tools/test-harness.sh

      - name: Run frontend tests
        run: bun run --cwd ./frontend test

      - name: Run frontend lint
        run: bun run --cwd ./frontend lint

      - name: Build frontend
        run: bun run --cwd ./frontend build

      # Runs after the frontend build: frontend/embed.go embeds dist/.
      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: app
          version: v2.14.0

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o /tmp/morgenblau ./cmd/api

      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('app/go.sum') }}-${{ github.sha }}

      - name: Audit introduced frontend findings
        env:
          FALLOW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: cd frontend && ./node_modules/.bin/fallow audit --base "$FALLOW_BASE" --gate new-only --quiet

  build-web:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        project: [site, brand]
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ matrix.project }}/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  deploy:
    name: Deploy ${{ matrix.project }}
    if: github.event_name == 'push'
    needs: [test, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-deploy-${{ matrix.project }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app
            token: FLY_API_TOKEN_APP
          - project: site
            token: FLY_API_TOKEN_SITE
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      # A slower run for an older commit must not replace what a newer commit deployed; the newer commit's run deploys it.
      - name: Check commit is still main's head
        id: head
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $GITHUB_SHA; its newer run deploys instead."
          fi

      - name: Deploy to Fly
        if: steps.head.outputs.current == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token] }}
        run: flyctl deploy --remote-only
