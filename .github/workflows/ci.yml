name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      # internal/database/db embeds the SQL that runs; a stale copy runs queries nobody reviewed.
      - name: Check sqlc output is current
        run: sqlc diff

      - name: Install Goose for migration tests
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Check Bun is the only package manager
        run: |
          stray="$(git ls-files '*package-lock.json' '*pnpm-lock.yaml' '*yarn.lock')"
          test -z "$stray" || { echo "Remove $stray: Bun owns every install (bun.lock), so installs stay reproducible."; exit 1; }

      - name: Install frontend dependencies
        run: bun install --cwd ./frontend --frozen-lockfile

      - name: Run frontend tests
        run: bun run --cwd ./frontend test

      - name: Run frontend lint
        run: bun run --cwd ./frontend lint

      - name: Build frontend
        run: bun run --cwd ./frontend build

      # Runs after the frontend build: frontend/embed.go embeds dist/.
      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o /tmp/morgenblau ./cmd/api

      - name: Audit introduced frontend findings
        env:
          FALLOW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: cd frontend && ./node_modules/.bin/fallow audit --base "$FALLOW_BASE" --gate new-only --quiet
