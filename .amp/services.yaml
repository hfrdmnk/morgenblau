services:
  vite:
    command: bun run dev --port "$PORT"
    cwd: app/frontend
    port: 5173
    health: /
  app:
    command: go run ./cmd/api
    cwd: app
    port: 8000
    env:
      APP_ENV: local
      DEV_LOGIN_ENABLED: "true"
      NEWSLETTER_DOMAIN: newsletter.localhost
      SMTP_LISTEN_ADDR: 127.0.0.1:2525
    health: /api/health
    portal:
      url: /login
      title: Morgenblau
      description: Use Log me in to access the configured development account. Actions write to its real PDS.
