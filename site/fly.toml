# fly.toml app configuration file generated for morgenblau-site on 2026-10-22T18:03:54Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'morgenblau-site'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
