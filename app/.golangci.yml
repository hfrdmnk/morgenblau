version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
    - gochecknoinits
  # Left out: gochecknoglobals. Package-level regexps and lookup tables are idiomatic here; removing them is a refactor with no wiring benefit.
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "log$"
              desc: "log through log/slog so every line is structured and leveled"
            - pkg: "github.com/pressly/goose"
              desc: "migrations run only through the goose CLI (make migrate-*), never in-process, so a deploy never migrates implicitly"
    forbidigo:
      forbid:
        - pattern: '^http\.(DefaultClient|Get|Head|Post|PostForm)$'
          msg: "fetch through internal/safehttp or internal/atidentity: the default client follows attacker-chosen URLs into private networks (SSRF)"
    staticcheck:
      checks:
        - all
        # The next six are staticcheck's own defaults.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    presets:
      # Unchecked Close, Flush and print errors, the idiomatic Go exceptions.
      - std-error-handling
    rules:
      # Tests fetch their own httptest servers, which are not attacker-chosen.
      - path: _test\.go
        linters:
          - forbidigo
      # Import errors double as user-facing copy; splitting message from error is a refactor.
      - path: internal/api/subscriptions_(import|opml|youtube)\.go
        text: ST1005
        linters:
          - staticcheck
